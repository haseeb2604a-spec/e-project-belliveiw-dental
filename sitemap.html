<style>
.sitemap-page { min-height: 100vh; padding: 80px 20px; display: flex; align-items: center; justify-content: center; background: var(--bg-alt); }
.sitemap-container { width: 100%; max-width: 820px; padding: 48px; text-align: center; background: #fff; border: 1px solid var(--border); border-top: 4px solid var(--teal); border-radius: 18px; box-shadow: var(--shadow); }
.sitemap-container h1 { margin-bottom: 6px; font-size: 38px; font-weight: 700; color: var(--navy); }
.sitemap-container h2 { margin-bottom: 12px; font-size: 22px; font-weight: 600; color: var(--teal); }
.sitemap-container p { color: var(--text-muted); margin-bottom: 32px; }
.sitemap-links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.sitemap-links a { padding: 16px 20px; text-decoration: none; color: var(--navy); background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; font-weight: 600; transition: .3s ease; }
.sitemap-links a:hover { color: #fff; background: var(--teal); border-color: var(--teal); transform: translateY(-3px); }
@media (max-width: 600px) { .sitemap-container { padding: 32px 20px; } .sitemap-container h1 { font-size: 30px; } .sitemap-links { grid-template-columns: 1fr; } }
</style>
</head>
